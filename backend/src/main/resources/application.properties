# 应用基础配置
spring.application.name=crs-backend
server.port=8080

# 数据库基础配置
spring.datasource.url=jdbc:mysql://localhost:3306/CRS?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT配置
jwt.secret=crsSecretKeyForJWTTokenGeneration2024MustBeLongEnough
jwt.expiration=86400
jwt.refresh-expiration=604800

# 日志配置
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.crs=DEBUG

# 环境配置
spring.profiles.active=dev

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
