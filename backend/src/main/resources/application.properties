# 应用基础配置
spring.application.name=crs-backend
server.port=${SERVER_PORT:8080}

# 数据库基础配置
spring.datasource.url=${CRS_DB_URL}
spring.datasource.username=${CRS_DB_USERNAME}
spring.datasource.password=${CRS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=${CRS_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${CRS_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway 数据库迁移配置：现有非空数据库首次接入时只登记 V1 baseline；空库会执行 V1。
spring.flyway.enabled=${CRS_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${CRS_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=CRS existing schema baseline
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true

# JWT配置
jwt.secret=${CRS_JWT_SECRET}
jwt.expiration=${CRS_JWT_EXPIRATION_SECONDS:86400}
jwt.refresh-expiration=${CRS_JWT_REFRESH_EXPIRATION_SECONDS:604800}

# PMS 入站 Webhook 默认关闭；启用时密钥至少 32 字节。
pms.webhook.enabled=${CRS_PMS_WEBHOOK_ENABLED:false}
pms.webhook.secret=${CRS_PMS_WEBHOOK_SECRET:}

# 日志配置
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.crs=${CRS_LOG_LEVEL:DEBUG}

# 环境配置
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
