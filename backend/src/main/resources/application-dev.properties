# 开发环境配置

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/CRS?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull

# JPA配置
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# 开发工具配置
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# 日志配置
logging.level.org.springframework=DEBUG
logging.level.com.crs=DEBUG
